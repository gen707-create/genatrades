name: Update Trading Dashboard

on:
  push:
    branches: [main]
    paths:
      - "tv_enrich.py"
      - "finviz_scan.py"
      - "track_new_tickers.py"
      - ".github/scripts/prefetch_heatmap.py"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    # GitHub heavily throttles frequent cron on public free repos — "*/10" was
    # nominally 78 runs/day but delivered only a handful, with 12h+ gaps.
    # Sparser schedules are honoured far more reliably.
    - cron: "*/30 9-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-build
  # Must be true: with `false`, a single run stuck in `queued` (as happened during
  # the 2026-08-26 Actions incident) blocks every later run behind it indefinitely.
  # The dashboard is a full rebuild each time, so superseding an older run is safe —
  # we only ever care about the most recent snapshot.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install tradingview-screener yfinance requests pandas
          pip install ib_insync || echo "ib_insync optional"

      - name: Run scanners and build dashboard
        timeout-minutes: 10
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          echo "=== Step 0: Pre-fetch heatmap data (before scans to avoid rate limit) ==="
          python3 .github/scripts/prefetch_heatmap.py 2>&1 || echo '[]' > /tmp/heatmap.json
          echo "heatmap: $(python3 -c 'import json;d=json.load(open("/tmp/heatmap.json"));print(len(d),"stocks")' 2>/dev/null || echo FAILED)"

          echo "=== Step 1: Minervini scan ==="
          python finviz_scan.py --strategy minervini > /tmp/scan_min.json || echo "{"strategy":"minervini","tickers":[]}" > /tmp/scan_min.json
          echo "scan_min: $(python3 -c 'import json;d=json.load(open("/tmp/scan_min.json"));print(len(d.get("tickers",[])),"tickers")' 2>/dev/null || echo FAILED)"

          echo "=== Step 2: CANSLIM scan ==="
          python finviz_scan.py --strategy canslim > /tmp/scan_can.json || echo "{"strategy":"canslim","tickers":[]}" > /tmp/scan_can.json
          echo "scan_can: $(python3 -c 'import json;d=json.load(open("/tmp/scan_can.json"));print(len(d.get("tickers",[])),"tickers")' 2>/dev/null || echo FAILED)"

          echo "=== Step 3: Reversion scan ==="
          python finviz_scan.py --strategy reversion > /tmp/scan_rev.json || echo "{"strategy":"reversion","tickers":[]}" > /tmp/scan_rev.json
          echo "scan_rev: $(python3 -c 'import json;d=json.load(open("/tmp/scan_rev.json"));print(len(d.get("tickers",[])),"tickers")' 2>/dev/null || echo FAILED)"

          echo "=== Step 3b: Base Breakout scan ==="
          python finviz_scan.py --strategy base_breakout > /tmp/scan_bb.json || echo '{"strategy":"base_breakout","tickers":[]}' > /tmp/scan_bb.json
          echo "scan_bb: $(python3 -c 'import json;d=json.load(open("/tmp/scan_bb.json"));print(len(d.get("tickers",[])),"tickers")' 2>/dev/null || echo FAILED)"

          echo "=== Step 3d: Day Trading scan ==="
          python finviz_scan.py --strategy day_trading > /tmp/scan_dt.json || echo '{"strategy":"day_trading","tickers":[]}' > /tmp/scan_dt.json
          echo "scan_dt: $(python3 -c 'import json;d=json.load(open("/tmp/scan_dt.json"));print(len(d.get("tickers",[])),"tickers")' 2>/dev/null || echo FAILED)"

          echo "=== Step 3e: Swing Gap scan ==="
          python finviz_scan.py --strategy swing_gap > /tmp/scan_sg.json || echo '{"strategy":"swing_gap","tickers":[]}' > /tmp/scan_sg.json
          echo "scan_sg: $(python3 -c 'import json;d=json.load(open("/tmp/scan_sg.json"));print(len(d.get("tickers",[])),"tickers")' 2>/dev/null || echo FAILED)"

          echo "=== Step 3f: Track new tickers ==="
          python track_new_tickers.py /tmp/scan_min.json /tmp/scan_can.json /tmp/scan_rev.json \
            /tmp/scan_bb.json /tmp/scan_dt.json /tmp/scan_sg.json || echo '[]' > /tmp/new_tickers.json
          echo "new tickers: $(cat /tmp/new_tickers.json)"

          echo "=== Step 4: Build dashboard ==="
          python tv_enrich.py --tabs \
            --scan /tmp/scan_min.json \
            --scan /tmp/scan_can.json \
            --scan /tmp/scan_rev.json \
            --scan /tmp/scan_bb.json \
            --scan /tmp/scan_dt.json \
            --scan /tmp/scan_sg.json \
            --new-tickers /tmp/new_tickers.json \
            --html --output index.html
          echo "index.html: $(wc -l < index.html) lines / $(wc -c < index.html) bytes"
          echo "JS check: $(grep -c mppSwitch index.html) mppSwitch refs"

      - name: Commit and push dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each file separately: `git add a b c` aborts and stages NOTHING
          # if any single path is missing, and ticker_history.json does not exist
          # until the first run that creates it.
          # Add each file separately with an explicit `|| true`: `git add a b c`
          # aborts and stages NOTHING if any single path is missing, and a bare
          # `[ -f ]` test failing on the last loop iteration would end the step
          # with a non-zero status under bash -e.
          for f in index.html prev_tickers.json ticker_history.json breadth_history.json; do
            if [ -f "$f" ]; then git add "$f"; else echo "skip (absent): $f"; fi
          done
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Dashboard update $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          # Track success explicitly. Without this the loop always ends on
          # `sleep 10` (exit 0), so three failed pushes still leave the step —
          # and the whole run — green while nothing reached the repository.
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              pushed=1
              echo "Pushed on attempt $i"
              break
            fi
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::All 3 push attempts failed — dashboard was built but not published"
            exit 1
          fi
